[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["express", "multer", "uuid", "serverless-http"]

# API → serverless Express (:splat keeps path after /api/)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA routes (Track deep links)
[[redirects]]
  from = "/track"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
