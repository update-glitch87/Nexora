[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"

[functions]
  node_bundler = "nft"
  included_files = ["node_modules/sql.js/dist/sql-wasm.wasm", "server/**"]
  external_node_modules = ["express", "multer", "uuid", "serverless-http", "sql.js", "@netlify/blobs", "@libsql/client"]

# API → serverless Express (:splat keeps path after /api/)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA routes (Track + hidden admin gate)
[[redirects]]
  from = "/track"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin82832783"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
